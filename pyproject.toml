[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-ldap-helper"
version = "1.0.1"
description = "LDAP authentication helper for Home Assistant's command-line auth provider"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "click==8.4.2",
    "flask==3.0.3",
    "ldap3==2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[project.scripts]
ldap-helper = "ldap_helper:main"

[project.urls]
Repository = "https://github.com/swagner-de/home-assistant-ldap-helper"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = ""
tag_format = "v{version}"
